[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spirometry"
version = "0.1.0"
description = "Causal analysis of Slay the Spire 2 early-access balance patches from community run data"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "duckdb",       # run tables (spirometry.runs)
    "pyarrow",      # run tables: Parquet output
]

[project.optional-dependencies]
# Added as the pipeline and analysis stages come online.
analysis = [
    "pandas",
    "numpy",
    "matplotlib",
    "jupyter",
    "scipy",        # audit notebook: KS / chi-square tests
    "pyfixest",     # Phase 5: fixed-effects regressions (DiD, IV)
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
